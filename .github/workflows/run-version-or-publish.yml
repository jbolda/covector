name: covector version or publish
on:
  push:
    branches:
      - main

permissions: {}

# publish runs must not race each other on npm; queue instead of cancel
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  covector:
    name: covector version or publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm provenance
      contents: write # required to create the GitHub Release
      pull-requests: write # required for creating the Version Packages Release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # credentials must persist for the create-pull-request step below to push its branch
          persist-credentials: true
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: git config
        env:
          PUSHER_NAME: ${{ github.event.pusher.name }}
          PUSHER_EMAIL: ${{ github.event.pusher.email }}
        run: |
          git config --global user.name "$PUSHER_NAME"
          git config --global user.email "$PUSHER_EMAIL"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:action
      - name: covector version-or-publish
        uses: ./packages/action
        id: covector
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: "version-or-publish"
          createRelease: true
          recognizeContributors: true
      - name: dump covector output
        env:
          COVECTOR_CONTEXT: ${{ toJson(steps.covector) }}
        run: echo "$COVECTOR_CONTEXT"
      - name: sync lockfile
        if: steps.covector.outputs.commandRan == 'version'
        run: npm install
      - name: covector publish --dry-run
        uses: ./packages/action
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          command: "publish"
          dryRun: true
      - name: create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        if: steps.covector.outputs.commandRan == 'version'
        with:
          title: "Publish New Versions"
          commit-message: "publish new versions"
          labels: "version updates, preview"
          branch: "release"
          body: ${{ steps.covector.outputs.change }}
